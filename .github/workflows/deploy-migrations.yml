name: Deploy Supabase migrations

# Applies pending `supabase/migrations/*.sql` to the production Supabase
# project. Triggered automatically on merges to main that touched the
# migrations directory, and on-demand via workflow_dispatch so operators
# can re-run after fixing a failure without needing a code-level push.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_PROJECT_REF  — the project's ref from Project Settings →
#                           General (looks like "abcdefghijklmno").
#   SUPABASE_ACCESS_TOKEN — personal access token from
#                           https://supabase.com/dashboard/account/tokens
#                           (scope: "Link a project" + "Access the API").
#   PRODUCTION_SUPABASE_DB_PASSWORD  — direct-connection Postgres password from
#                                   Project Settings → Database → Connection
#                                   string. Required by `supabase db push` to
#                                   open the management tunnel.
#
# Without these three secrets the job fails at the first `supabase`
# command — that is intentional. Production migrations are a privileged
# operation and should never run against a misconfigured target.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-migrations.yml"
  workflow_dispatch:
    inputs:
      repair_versions_applied:
        description: |
          Space-separated list of migration versions to mark as APPLIED
          (without re-running their SQL) before db push. Use when a
          migration's SQL was applied out-of-band but the
          schema_migrations row never landed (e.g. after a
          version-prefix collision left the table created without the
          tracking row). Each entry maps to:
              supabase migration repair --status applied <version> --linked
          Leave blank for normal pushes.
        required: false
        default: ""
      repair_versions_reverted:
        description: |
          Space-separated list of migration versions to mark as REVERTED
          (clear the schema_migrations row without dropping any objects)
          before db push. Use to undo a stale or wrongly-applied tracking
          row — e.g. when `repair_versions_applied` was used on a fresh
          environment that didn't actually have the underlying schema,
          leaving a row that points at nothing. Each entry maps to:
              supabase migration repair --status reverted <version> --linked
          Leave blank for normal pushes. Reverted runs before applied
          when both are supplied, so a row can be cleared and re-marked
          in a single dispatch if needed.
          IMPORTANT: if you are using this to restore "pending" state for
          future migrations after a repair_versions_applied skipping run,
          set skip_push=true to prevent the push step from immediately
          applying all the just-restored pending migrations.
        required: false
        default: ""
      skip_push:
        type: boolean
        default: false
        description: |
          When true, skip the 'supabase db push' step entirely.
          Use for repair-only dispatches where you want to update
          schema_migrations tracking rows WITHOUT applying any pending
          SQL. Prevents the incident where repair_versions_reverted
          restores pending migrations and db push immediately runs them.
          (2026-05-28 incident: 0157 applied without per-migration approval
          because the revert dispatch also triggered db push.)

concurrency:
  # Serialise runs against the same project — two concurrent
  # `db push`es would race on the migrations table.
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub Environments let Steven gate production runs behind a
    # required-reviewer if desired. If the "production" environment
    # doesn't exist yet the job still runs; Settings → Environments
    # can tighten later without a code change.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets are set
        run: |
          missing=0
          for var in SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN PRODUCTION_SUPABASE_DB_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Required secret $var is not set."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "See .github/workflows/deploy-migrations.yml header for setup."
            exit 1
          fi
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}

      - name: Link to production project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Show pending migrations (diagnostic)
        run: supabase migration list --linked || true

      - name: Repair flagged versions (mark reverted — clear tracking row)
        if: github.event_name == 'workflow_dispatch' && inputs.repair_versions_reverted != ''
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ${{ inputs.repair_versions_reverted }}; do
            echo "Marking version $v as reverted..."
            supabase migration repair --status reverted "$v" --linked
          done

      - name: Repair flagged versions (mark applied without re-running SQL)
        if: github.event_name == 'workflow_dispatch' && inputs.repair_versions_applied != ''
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ${{ inputs.repair_versions_applied }}; do
            echo "Marking version $v as applied..."
            supabase migration repair --status applied "$v" --linked
          done

      - name: Push pending migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_push != true }}
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
        # --include-all ensures no migrations are skipped when the
        # production schema has drifted from the linked state (e.g. a
        # row was manually inserted but the migration files themselves
        # were never applied). supabase db push is idempotent — already-
        # applied migrations are no-ops.
        # Skipped when skip_push=true (repair-only dispatch) to prevent
        # accidentally applying pending migrations after a reverted repair.
        run: supabase db push --linked --include-all

      - name: Summarise on success
        if: success()
        run: |
          {
            echo '## Migrations pushed'
            echo
            supabase migration list --linked 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # push-staging — applies the same migration set to the staging Supabase project.
  #
  # ISOLATION GUARANTEE: this job uses exclusively STAGING_* secrets and never
  # reads SUPABASE_PROJECT_REF or PRODUCTION_SUPABASE_DB_PASSWORD. The two
  # environments are referenced by distinct, non-overlapping secret names so
  # they cannot be swapped or accidentally defaulted to each other.
  #
  # Required GitHub secrets (Settings → Secrets → Actions):
  #   STAGING_SUPABASE_PROJECT_REF  — staging project ref (bjiiqnetaxoibhcaukqm)
  #   STAGING_SUPABASE_DB_PASSWORD  — staging direct-connection DB password
  #   SUPABASE_ACCESS_TOKEN         — shared account-level token (already set)
  #
  # If either STAGING_* secret is absent the job emits a clear warning and
  # exits 0 — it never falls back to production values and never blocks the
  # production push.
  # ---------------------------------------------------------------------------
  push-staging:
    name: supabase db push (staging)
    runs-on: ubuntu-latest
    needs: push
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check staging secrets — skip if either is missing
        id: secrets-check
        run: |
          skip=false
          if [ -z "${STAGING_PROJECT_REF:-}" ]; then
            echo "::warning::STAGING_SUPABASE_PROJECT_REF is not set — skipping staging push."
            skip=true
          fi
          if [ -z "${STAGING_DB_PASSWORD:-}" ]; then
            echo "::warning::STAGING_SUPABASE_DB_PASSWORD is not set — skipping staging push."
            skip=true
          fi
          # Hard guard: must not reference the production ref under any circumstance.
          # SUPABASE_PROJECT_REF is intentionally NOT passed to this step so it
          # cannot be read here even if the env block were changed accidentally.
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
        env:
          STAGING_PROJECT_REF:  ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DB_PASSWORD:  ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Link to staging project
        if: steps.secrets-check.outputs.skip == 'false'
        # References STAGING_SUPABASE_PROJECT_REF explicitly — never SUPABASE_PROJECT_REF.
        run: supabase link --project-ref "${{ secrets.STAGING_SUPABASE_PROJECT_REF }}"

      - name: Show pending migrations (diagnostic)
        if: steps.secrets-check.outputs.skip == 'false'
        run: supabase migration list --linked || true

      - name: Push pending migrations to staging
        if: steps.secrets-check.outputs.skip == 'false'
        env:
          # SUPABASE_DB_PASSWORD is set to the STAGING password only.
          # The production password (PRODUCTION_SUPABASE_DB_PASSWORD) is
          # never referenced in this job.
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --include-all

      - name: Summarise on success
        if: steps.secrets-check.outputs.skip == 'false' && success()
        run: |
          {
            echo '## Staging migrations pushed'
            echo
            supabase migration list --linked 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g'
          } >> "$GITHUB_STEP_SUMMARY"
